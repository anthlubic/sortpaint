name: Deploy leaderboard worker

# Kept apart from pages.yml on purpose. The game's deploy must not grow a dependency on
# Cloudflare, and this must not have to wait on a web publish that takes minutes.
#
# Only runs when something the worker actually serves has changed: its own source, the levels it
# measures submissions against, or the script that turns those levels into its table. An ordinary
# game commit does not redeploy the backend.
on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'levels/**'
      - 'scripts/seed_levels.py'
      - 'scripts/sortpaint/level.py'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci
        working-directory: worker

      # The acceptance rules are the only thing standing between an open endpoint and a defaced
      # board, so nothing ships without them passing.
      - name: Test
        run: npx vitest run
        working-directory: worker

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # Read straight out of levels/*.tres, so the server's idea of a level's optimal cannot drift
      # from the game's.
      - name: Build the level table
        run: python3 scripts/seed_levels.py -o worker/levels.sql

      - name: Apply the schema
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute sortpaint-leaderboard --file=schema.sql --remote --yes

      - name: Seed the levels
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: d1 execute sortpaint-leaderboard --file=levels.sql --remote --yes

      # Last, so the worker only goes live against a table that is already there and current.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy
